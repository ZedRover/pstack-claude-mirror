name: sync-and-publish

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "upstream ref (default: newest vX.Y.Z tag)"
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ vars.PKG_NAME || 'pstack-claude-mirror' }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build and publish current upstream release
        run: |
          args=()
          if [[ -n "$UPSTREAM_REF" ]]; then
            args+=(--ref "$UPSTREAM_REF")
          fi
          npm run release -- "${args[@]}" --provenance
        env:
          UPSTREAM_REF: ${{ inputs.ref }}
          PKG_NAME: ${{ vars.PKG_NAME || 'pstack-claude-mirror' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
